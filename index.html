<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Markdown 流程图渲染器</title>
<style>
:root{--bg:#f6f7f9;--panel:#fff;--text:#1f2328;--muted:#656d76;--border:#d8dee4;--accent:#2563eb;--accent-text:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1115;--panel:#181b21;--text:#e6e8eb;--muted:#9aa4b0;--border:#2d333b;--accent:#3b82f6}}
:root[data-theme="dark"]{--bg:#0f1115;--panel:#181b21;--text:#e6e8eb;--muted:#9aa4b0;--border:#2d333b;--accent:#3b82f6}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;height:100vh;display:flex;flex-direction:column}
header{padding:10px 16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--border);background:var(--panel);flex-wrap:wrap}
header h1{font-size:16px;margin:0;flex:1}
select,button{font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:5px 12px;cursor:pointer}
button.primary{background:var(--accent);color:var(--accent-text);border-color:var(--accent)}
button:hover{filter:brightness(.95)}
main{flex:1;display:grid;grid-template-columns:minmax(260px,40%) 1fr;min-height:0}
@media (max-width:760px){main{grid-template-columns:1fr;grid-template-rows:40% 1fr}}
textarea{width:100%;height:100%;resize:none;border:0;border-right:1px solid var(--border);padding:14px;background:var(--panel);color:var(--text);font:13px/1.5 ui-monospace,Menlo,Consolas,monospace;outline:none}
#out{overflow:auto;padding:16px;display:flex;flex-direction:column;gap:16px}
.card{flex-shrink:0;background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:8px;overflow:hidden}
.bar{display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--panel);color:var(--text);border-bottom:1px solid var(--border)}
.bar .t{flex:1;color:var(--muted);font-size:12px}
.bar button{padding:3px 10px;font-size:12px}
.body{padding:16px;overflow:auto;text-align:center;background:#fff;cursor:zoom-in}
.body.transparent{background:repeating-conic-gradient(#e5e7eb 0 25%,#fff 0 50%) 0 0/16px 16px}
.body.dark{background:#0d1117;color:#e6edf3}
.body.dark pre{color:#e6edf3}
#drop{outline:2px dashed var(--accent);outline-offset:-6px}
#zoom{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;z-index:10;overflow:hidden;cursor:grab}
#zoom.show{display:block}
#zoom.drag{cursor:grabbing}
#zoomStage{position:absolute;left:0;top:0;transform-origin:0 0;padding:24px;border-radius:8px}
#zoomStage svg{max-width:none!important;height:auto}
#zoomBar{position:fixed;top:12px;right:12px;display:flex;gap:6px;z-index:11}
#zoomHint{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);color:#fff;font-size:12px;opacity:.7;z-index:11}
.body svg{max-width:100%;height:auto}
.editor{display:block;width:100%;height:170px;border:0;border-top:1px solid var(--border);padding:10px;background:var(--panel);color:var(--text);font:13px/1.5 ui-monospace,Menlo,Consolas,monospace;resize:vertical;outline:none}
.err{color:#cf222e;white-space:pre-wrap;text-align:left;font:12px ui-monospace,monospace}
.empty{color:var(--muted);text-align:center;margin:auto}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1f2328;color:#fff;padding:8px 16px;border-radius:6px;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.show{opacity:1}
</style>
</head>
<body>
<header>
  <h1>Markdown 流程图渲染器</h1>
  <label>界面 <select id="ui"><option value="auto">自动</option><option value="light">浅色</option><option value="dark">深色</option></select></label>
  <label>图主题 <select id="theme"><option value="default">默认</option><option value="neutral">中性</option><option value="forest">森林</option><option value="dark">深色</option></select></label>
  <label>背景 <select id="bg"><option value="white">白色</option><option value="transparent">透明</option><option value="dark">深色</option></select></label>
  <label>清晰度 <select id="scale"><option value="2">2x</option><option value="3" selected>3x</option><option value="4">4x</option></select></label>
  <button id="open">打开 .md</button><input id="file" type="file" accept=".md,.markdown,.txt,.mmd" hidden>
  <button id="share">分享链接</button>
  <button id="sample">示例</button>
  <button id="copyAll" class="primary">复制全部为一张图</button>
</header>
<main>
  <textarea id="src" placeholder="在这里粘贴 Markdown……&#10;支持 ```mermaid 代码块、直接粘贴的 Mermaid 代码，以及 ASCII 结构图 / 目录树（```text 代码块）。"></textarea>
  <div id="out"></div>
</main>
<div id="zoom"><div id="zoomStage"></div></div>
<div id="zoomBar" hidden><button id="zIn">＋</button><button id="zOut">－</button><button id="zFit">适应</button><button id="zClose">关闭 (Esc)</button></div>
<div id="zoomHint" hidden>滚轮缩放 · 拖动平移</div>
<div id="toast"></div>

<script src="vendor/mermaid.min.js"></script>
<script>

const $ = id => document.getElementById(id);
const src = $("src"), out = $("out");
const MERMAID_START = /^\s*(graph|flowchart|sequenceDiagram|classDiagram|stateDiagram(-v2)?|erDiagram|gantt|pie|journey|mindmap|timeline|gitGraph|quadrantChart|requirementDiagram|C4Context|sankey-beta|xychart-beta|block-beta)\b/;
const BOX_CHARS = /[│├└┌┐┘─┬┴┼╭╮╯╰▼▲►◄→←↓↑]|[+|]-{2,}|-{2,}[+>]/;
const ASCII_FONT = "ui-monospace,Menlo,Consolas,'Sarasa Mono SC','Noto Sans Mono CJK SC','PingFang SC','Microsoft YaHei',monospace";

let uid = 0, renderSeq = 0;
const items = []; // {title, canvasSource: () => Promise<canvas>}

function toast(msg){const t=$("toast");t.textContent=msg;t.classList.add("show");clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove("show"),1800)}

function initMermaid(){
  mermaid.initialize({startOnLoad:false,theme:$("bg").value==="dark"?"dark":$("theme").value,securityLevel:"strict",
    // htmlLabels:false 让节点文字使用纯 SVG，否则导出 PNG 时画布会被污染
    flowchart:{htmlLabels:false,useMaxWidth:false},
    sequence:{useMaxWidth:false},class:{htmlLabels:false},state:{useMaxWidth:false},
    fontFamily:"'PingFang SC','Microsoft YaHei',sans-serif"});
}

// 解析输入 → [{kind:'mermaid'|'ascii', code, title}]
function extract(md){
  const blocks = [];
  const re = /^[ \t]*(`{3,}|~{3,})[ \t]*([\w-]*)[^\n]*\n([\s\S]*?)^[ \t]*\1[`~]*[ \t]*$/gm;
  let m, found = false;
  const headingBefore = idx => { const hs = [...md.slice(0, idx).matchAll(/^#{1,6}\s+(.+)$/gm)]; return hs.length ? hs[hs.length-1][1].trim() : ""; };
  // start/end：代码在源文本中的范围；fenceStart/fenceEnd：含围栏的整块范围（用于编辑和转换时回写）
  while ((m = re.exec(md))) {
    found = true;
    const lang = m[2].toLowerCase(), code = m[3].replace(/\s+$/,"");
    const start = m.index + m[0].indexOf("\n") + 1;
    const pos = {start, end:start + code.length, fenceStart:m.index, fenceEnd:m.index + m[0].length};
    if (lang === "mermaid" || lang === "mmd" || (!lang && MERMAID_START.test(code)))
      blocks.push({kind:"mermaid", code, title:headingBefore(m.index), ...pos});
    else if ((["", "text", "txt", "ascii", "plain", "plaintext", "tree"].includes(lang)) && BOX_CHARS.test(code) && code.split("\n").length >= 2)
      blocks.push({kind:"ascii", code, title:headingBefore(m.index), ...pos});
  }
  if (!found) {
    const code = md.replace(/\s+$/,"").replace(/^\s*\n/,""), start = md.indexOf(code);
    const pos = {start, end:start + code.length, fenceStart:0, fenceEnd:md.length};
    if (MERMAID_START.test(md)) blocks.push({kind:"mermaid", code, title:"", ...pos});
    else if (BOX_CHARS.test(md) && md.trim().split("\n").length >= 2) blocks.push({kind:"ascii", code, title:"", ...pos});
  }
  return blocks;
}

// ---- 背景 ----
const BG = {white:"#ffffff", transparent:null, dark:"#0d1117"};
const bgColor = () => BG[$("bg").value];
const fgColor = () => $("bg").value === "dark" ? "#e6edf3" : "#1f2328";

// ---- SVG 序列化 / 转 canvas ----
function svgString(svgEl){
  const clone = svgEl.cloneNode(true);
  const vb = svgEl.viewBox && svgEl.viewBox.baseVal;
  const bb = svgEl.getBoundingClientRect();
  const w = Math.ceil(vb && vb.width ? vb.width : bb.width), h = Math.ceil(vb && vb.height ? vb.height : bb.height);
  clone.setAttribute("xmlns","http://www.w3.org/2000/svg");
  clone.setAttribute("width", w); clone.setAttribute("height", h);
  clone.style.maxWidth = "none";
  const c = bgColor();
  if (c) {
    const r = document.createElementNS("http://www.w3.org/2000/svg","rect");
    r.setAttribute("x", vb ? vb.x : 0); r.setAttribute("y", vb ? vb.y : 0);
    r.setAttribute("width", w); r.setAttribute("height", h); r.setAttribute("fill", c);
    clone.insertBefore(r, clone.firstChild);
  }
  return {xml:'<?xml version="1.0" encoding="UTF-8"?>\n' + new XMLSerializer().serializeToString(clone), w, h};
}
function svgToCanvas(svgEl, scale){
  return new Promise((resolve, reject) => {
    const {xml, w, h} = svgString(svgEl);
    const img = new Image();
    img.onload = () => {
      const c = document.createElement("canvas");
      c.width = w*scale; c.height = h*scale;
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      resolve(c);
    };
    img.onerror = () => reject(new Error("SVG 转图片失败"));
    img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(xml);
  });
}

// ---- ASCII 图：测量、画 canvas、生成 SVG ----
const isWide = ch => /[\u1100-\u115f\u2e80-\ua4cf\uac00-\ud7a3\uf900-\ufaff\ufe30-\ufe6f\uff00-\uff60\uffe0-\uffe6]/.test(ch);
function asciiLayout(code){
  const lines = code.replace(/\t/g,"    ").split("\n");
  const fs = 14, lh = Math.round(fs*1.2), pad = 20;
  const probe = document.createElement("canvas").getContext("2d");
  probe.font = `${fs}px ${ASCII_FONT}`;
  const cell = probe.measureText("M").width; // 半角宽度；全角字符占 2 格
  const cols = Math.max(...lines.map(l => [...l].reduce((n,c)=>n+(isWide(c)?2:1),0)));
  return {lines, fs, lh, pad, cell, w:Math.ceil(cols*cell + pad*2), h:lines.length*lh + pad*2};
}
function asciiToCanvas(code, scale){
  const {lines, fs, lh, pad, cell, w, h} = asciiLayout(code);
  const c = document.createElement("canvas");
  c.width = w*scale; c.height = h*scale;
  const g = c.getContext("2d");
  g.scale(scale,scale);
  if (bgColor()) { g.fillStyle = bgColor(); g.fillRect(0,0,w,h); }
  g.fillStyle = fgColor(); g.font = `${fs}px ${ASCII_FONT}`; g.textBaseline = "middle";
  lines.forEach((l,i) => { let x = pad; for (const ch of l) { const n = isWide(ch)?2:1; g.fillText(ch, x, pad + i*lh + lh/2); x += n*cell; } });
  return c;
}
function asciiToSvg(code){
  const {lines, fs, lh, pad, cell, w, h} = asciiLayout(code);
  const esc = t => t.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  let body = bgColor() ? `<rect width="${w}" height="${h}" fill="${bgColor()}"/>` : "";
  lines.forEach((l,i) => {
    const chars = [...l], xs = []; let x = pad;
    for (const ch of chars) { xs.push(+x.toFixed(2)); x += (isWide(ch)?2:1)*cell; }
    if (!chars.some(ch => ch.trim())) return;
    body += `<text x="${xs.join(" ")}" y="${pad + i*lh + lh/2}" dominant-baseline="central" xml:space="preserve">${chars.map(esc).join("")}</text>`;
  });
  return {xml:`<?xml version="1.0" encoding="UTF-8"?>\n<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" font-family="${ASCII_FONT.replace(/"/g,"'")}" font-size="${fs}" fill="${fgColor()}">${body}</svg>`};
}

// ---- ASCII 框图 → Mermaid（尽力而为：识别 Unicode 框线画的方框和连线）----
function asciiToMermaid(code){
  const grid = code.replace(/\t/g,"    ").split("\n").map(l => { const r = []; for (const ch of l) { r.push(ch); if (isWide(ch)) r.push("\0"); } return r; });
  const H = grid.length, W = Math.max(...grid.map(r => r.length));
  const at = (y,x) => (grid[y] && grid[y][x]) || " ";
  const HZ = new Set("─┬┴"), VT = new Set("│├┤"), TL = new Set("┌╭"), TR = new Set("┐╮"), BL = new Set("└╰"), BR = new Set("┘╯");
  const VEC = {U:[-1,0], D:[1,0], L:[0,-1], R:[0,1]}, OPP = {U:"D", D:"U", L:"R", R:"L"};
  const ARROW = {"▼":"U","↓":"U","▲":"D","↑":"D","▶":"L","►":"L","→":"L","◀":"R","◄":"R","←":"R"}; // 值为箭头连线的一侧，箭头指向其反方向
  const CONN = {"│":"UD","─":"LR","┬":"LRD","┴":"LRU","├":"UDR","┤":"UDL","┼":"UDLR","┌":"RD","┐":"LD","└":"RU","┘":"LU","╭":"RD","╮":"LD","╰":"RU","╯":"LU",...ARROW};

  // 1. 找方框
  let boxes = [];
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    if (!TL.has(at(y,x))) continue;
    let x2 = x + 1; while (HZ.has(at(y,x2))) x2++;
    if (!TR.has(at(y,x2)) || x2 - x < 2) continue;
    let y2 = y + 1, ok = true;
    while (VT.has(at(y2,x))) { if (!VT.has(at(y2,x2))) { ok = false; break; } y2++; }
    if (!ok || y2 - y < 2 || !BL.has(at(y2,x)) || !BR.has(at(y2,x2))) continue;
    for (let xx = x + 1; xx < x2; xx++) if (!HZ.has(at(y2,xx))) ok = false;
    if (ok) boxes.push({x, y, x2, y2});
  }
  boxes = boxes.filter(a => !boxes.some(b => b !== a && b.x > a.x && b.x2 < a.x2 && b.y > a.y && b.y2 < a.y2)); // 丢弃包着别的框的外框
  if (boxes.length < 2) return null;
  boxes.forEach((b, i) => {
    b.id = "N" + (i + 1);
    const rows = [];
    for (let yy = b.y + 1; yy < b.y2; yy++) { const t = grid[yy].slice(b.x + 1, b.x2).filter(c => c !== "\0").join("").trim(); if (t) rows.push(t); }
    b.label = rows.join("<br/>") || b.id;
  });

  // 2. 标记框占用的格子，其余带连接方向的字符是线
  const boxOf = new Map(), border = new Set();
  boxes.forEach((b, i) => { for (let y = b.y; y <= b.y2; y++) for (let x = b.x; x <= b.x2; x++) { boxOf.set(y*W + x, i); if (y === b.y || y === b.y2 || x === b.x || x === b.x2) border.add(y*W + x); } });
  const isLine = (y,x) => !boxOf.has(y*W + x) && CONN[at(y,x)];
  const seen = new Set(), edges = [];
  const reach = (y, x, d) => { // 沿方向 d 越过至多 2 个空格，看是否碰到某个框的边
    for (let k = 1; k <= 3; k++) { const yy = y + VEC[d][0]*k, xx = x + VEC[d][1]*k, c = at(yy,xx);
      if (c === " " && k < 3) continue;
      return border.has(yy*W + xx) ? boxOf.get(yy*W + xx) : -1; }
    return -1;
  };

  // 3. 把相连的线分成一组组，看每组碰到哪些框，哪边有箭头
  for (let y0 = 0; y0 < H; y0++) for (let x0 = 0; x0 < W; x0++) {
    if (!isLine(y0,x0) || seen.has(y0*W + x0)) continue;
    const stack = [[y0,x0]], heads = new Set(), tails = new Set(); seen.add(y0*W + x0);
    while (stack.length) {
      const [y,x] = stack.pop(), ch = at(y,x), dirs = CONN[ch];
      for (const d of dirs) {
        const ny = y + VEC[d][0], nx = x + VEC[d][1];
        if (isLine(ny,nx) && CONN[at(ny,nx)].includes(OPP[d])) { if (!seen.has(ny*W + nx)) { seen.add(ny*W + nx); stack.push([ny,nx]); } }
        else { const bi = reach(y, x, d); if (bi >= 0) tails.add(bi); }
      }
      if (ARROW[ch]) { const bi = reach(y, x, OPP[ARROW[ch]]); if (bi >= 0) heads.add(bi); }
    }
    for (const h of heads) tails.delete(h);
    if (heads.size && tails.size) for (const t of tails) for (const h of heads) edges.push([t,h,"-->"]);
    else if (heads.size === 2 && !tails.size) edges.push([...heads].concat("<-->"));
    else if (!heads.size && tails.size === 2) edges.push([...tails].concat("---"));
  }
  if (!edges.length) return null;

  // 4. 输出；横向连线居多用 LR，否则 TD
  const cx = i => (boxes[i].x + boxes[i].x2)/2, cy = i => (boxes[i].y + boxes[i].y2)/2;
  let dx = 0, dy = 0; for (const [a,b] of edges) { dx += Math.abs(cx(a) - cx(b)); dy += Math.abs(cy(a) - cy(b)) * 3; }
  const q = t => t.replace(/"/g, "#quot;");
  return [`flowchart ${dx > dy ? "LR" : "TD"}`, ...boxes.map(b => `  ${b.id}["${q(b.label)}"]`), ...edges.map(([a,b,op]) => `  ${boxes[a].id} ${op} ${boxes[b].id}`)].join("\n");
}

const toBlob = c => new Promise(r => c.toBlob(r, "image/png"));

async function copyBlob(blobPromise){
  try {
    // 传入 Promise 以保留用户手势（Safari 需要）
    await navigator.clipboard.write([new ClipboardItem({"image/png": blobPromise})]);
    toast("已复制图片，直接粘贴即可");
  } catch (e) {
    console.error(e);
    toast("复制失败（需 HTTPS/localhost 且浏览器支持），请改用下载");
  }
}
function download(blob, name){
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
}

function stitch(canvases){
  const gap = 24 * 1, W = Math.max(...canvases.map(c=>c.width)), H = canvases.reduce((s,c)=>s+c.height,0) + gap*(canvases.length-1);
  const c = document.createElement("canvas"); c.width = W; c.height = H;
  const g = c.getContext("2d"); if (bgColor()) { g.fillStyle=bgColor(); g.fillRect(0,0,W,H); }
  let y = 0; canvases.forEach(cv => { g.drawImage(cv, (W-cv.width)/2, y); y += cv.height + gap; });
  return c;
}

let curBlocks = [];

async function draw(card, b, item){
  const body = card.querySelector(".body"), token = card._t = (card._t || 0) + 1;
  const btns = [...card.querySelectorAll(".bar button")].filter(x => ["copy","dl","svg"].includes(x.dataset.a));
  if (b.kind === "mermaid") {
    const id = "m" + (++uid);
    try {
      const { svg } = await mermaid.render(id, b.code);
      if (token !== card._t) return;
      body.innerHTML = svg;
      const svgEl = body.querySelector("svg");
      item.getCanvas = () => svgToCanvas(svgEl, +$("scale").value);
      item.getSvg = () => svgString(svgEl);
      btns.forEach(x => x.disabled = false);
    } catch (e) {
      if (token !== card._t) return;
      document.getElementById("d" + id)?.remove();
      body.innerHTML = `<div class="err"></div>`;
      body.firstChild.textContent = "Mermaid 语法错误：\n" + (e.message || e);
      item.getCanvas = item.getSvg = null;
      btns.forEach(x => x.disabled = true);
    }
  } else {
    const pre = document.createElement("pre");
    pre.style.cssText = `margin:0;text-align:left;display:inline-block;font:14px/17px ${ASCII_FONT}`;
    pre.textContent = b.code; body.replaceChildren(pre);
    item.getCanvas = async () => asciiToCanvas(b.code, +$("scale").value);
    item.getSvg = () => asciiToSvg(b.code);
    btns.forEach(x => x.disabled = false);
  }
}

// 卡片内编辑：把改动同步回左侧原文，并顺延后面各块的位置
function syncBlock(i, v){
  const b = curBlocks[i], delta = v.length - (b.end - b.start);
  src.value = src.value.slice(0, b.start) + v + src.value.slice(b.end);
  b.code = v; b.end += delta; b.fenceEnd += delta;
  for (const o of curBlocks.slice(i + 1)) { o.start += delta; o.end += delta; o.fenceStart += delta; o.fenceEnd += delta; }
  save();
}

function buildCard(b, i, item){
  const card = document.createElement("div"); card.className = "card";
  card.innerHTML = `<div class="bar"><span class="t"></span><button data-a="edit">编辑</button>${b.kind === "ascii" ? '<button data-a="mm" title="把 ASCII 框图转成可换主题、可缩放的 Mermaid 流程图">转为 Mermaid</button>' : ""}<button data-a="copy" class="primary">复制图片</button><button data-a="dl">下载 PNG</button><button data-a="svg">下载 SVG</button></div><div class="body"></div><textarea class="editor" spellcheck="false" hidden></textarea>`;
  card.querySelector(".t").textContent = b.title || `${b.kind === "mermaid" ? "流程图" : "结构图"} ${i+1}`;
  const body = card.querySelector(".body"), ta = card.querySelector(".editor");
  body.classList.add($("bg").value);
  ta.value = b.code;
  let t;
  ta.addEventListener("input", () => { syncBlock(i, ta.value); clearTimeout(t); t = setTimeout(() => draw(card, b, item), 250); });
  card.addEventListener("click", ev => {
    const a = ev.target.dataset?.a; if (!a) return;
    if (a === "edit") { ta.hidden = !ta.hidden; ev.target.textContent = ta.hidden ? "编辑" : "收起"; if (!ta.hidden) ta.focus(); }
    if (a === "mm") {
      const mm = asciiToMermaid(b.code);
      if (!mm) return toast("没能识别出方框和连线（仅支持 ┌─┐│└─┘ 画的框，且要有连线/箭头）");
      src.value = src.value.slice(0, b.fenceStart) + "```mermaid\n" + mm + "\n```" + src.value.slice(b.fenceEnd);
      save(); render(); toast("已转为 Mermaid，可继续点“编辑”微调");
    }
    if (!item.getCanvas) return;
    if (a === "copy") copyBlob(item.getCanvas().then(toBlob));
    if (a === "dl") item.getCanvas().then(toBlob).then(bl => download(bl, `diagram-${i+1}.png`));
    if (a === "svg") download(new Blob([item.getSvg().xml], {type:"image/svg+xml"}), `diagram-${i+1}.svg`);
  });
  body.addEventListener("click", () => openZoom(body.firstElementChild, b.kind));
  return card;
}

async function render(){
  const seq = ++renderSeq;
  curBlocks = extract(src.value);
  items.length = 0;
  if (!curBlocks.length) {
    out.innerHTML = `<div class="empty">${src.value.trim() ? "没有识别到流程图（需要 ```mermaid 代码块，或含框线字符的 ASCII 结构图）" : "左侧粘贴 Markdown，这里会实时显示流程图"}</div>`;
    return;
  }
  const frag = document.createDocumentFragment();
  for (const [i, b] of curBlocks.entries()) {
    const item = {}; items.push(item);
    const card = buildCard(b, i, item);
    await draw(card, b, item);
    if (seq !== renderSeq) return;
    frag.appendChild(card);
  }
  out.replaceChildren(frag);
}

// ---- 本地保存 ----
const STORE = "md-flowchart:v1";
const save = () => { try { localStorage.setItem(STORE, JSON.stringify({src:src.value, theme:$("theme").value, bg:$("bg").value, scale:$("scale").value, ui:$("ui").value})); } catch {} };
const restore = () => { try { const d = JSON.parse(localStorage.getItem(STORE) || "{}");
  if (d.src) src.value = d.src;
  for (const k of ["theme","bg","scale","ui"]) if (d[k] && [...$(k).options].some(o => o.value === d[k])) $(k).value = d[k]; } catch {} };

let timer;
src.addEventListener("input", () => { save(); clearTimeout(timer); timer = setTimeout(render, 300); });
for (const id of ["theme","bg"]) $(id).addEventListener("change", () => { save(); initMermaid(); render(); });
$("scale").addEventListener("change", save);
const applyUi = () => { const v = $("ui").value; if (v === "auto") document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme", v); };
$("ui").addEventListener("change", () => { applyUi(); save(); });

// ---- 分享链接：内容压缩后放进 URL #d=...（不经过任何服务器）----
const b64 = {
  enc: u8 => { let s = ""; u8.forEach(v => s += String.fromCharCode(v)); return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""); },
  dec: t => Uint8Array.from(atob(t.replace(/-/g,"+").replace(/_/g,"/")), c => c.charCodeAt(0))
};
const pipe = async (data, T) => new Uint8Array(await new Response(new Blob([data]).stream().pipeThrough(new T("deflate-raw"))).arrayBuffer());
async function shareLink(){
  const json = JSON.stringify({s:src.value, t:$("theme").value, b:$("bg").value});
  return location.origin + location.pathname + "#d=" + b64.enc(await pipe(json, CompressionStream));
}
async function loadHash(){
  if (!location.hash.startsWith("#d=")) return;
  try {
    const d = JSON.parse(new TextDecoder().decode(await pipe(b64.dec(location.hash.slice(3)), DecompressionStream)));
    src.value = d.s || "";
    for (const k of [["t","theme"],["b","bg"]]) if (d[k[0]] && [...$(k[1]).options].some(o => o.value === d[k[0]])) $(k[1]).value = d[k[0]];
    history.replaceState(null, "", location.pathname + location.search);
    toast("已载入分享的内容");
  } catch { toast("分享链接无法解析"); }
}
$("share").addEventListener("click", async () => {
  if (!src.value.trim()) return toast("先粘贴一些内容");
  const url = await shareLink();
  try { await navigator.clipboard.writeText(url); toast(url.length > 8000 ? "链接已复制（内容较长，部分聊天软件可能截断）" : "分享链接已复制"); }
  catch { prompt("复制这个链接：", url); }
});

// ---- 打开 / 拖入文件 ----
function loadFile(f){
  if (!f) return;
  const r = new FileReader();
  r.onload = () => { src.value = r.result; save(); render(); toast("已载入 " + f.name); };
  r.readAsText(f);
}
$("open").addEventListener("click", () => $("file").click());
$("file").addEventListener("change", e => { loadFile(e.target.files[0]); e.target.value = ""; });
document.addEventListener("dragover", e => { e.preventDefault(); src.id = "drop"; });
document.addEventListener("dragleave", e => { if (!e.relatedTarget) src.id = "src"; });
document.addEventListener("drop", e => { e.preventDefault(); src.id = "src"; loadFile(e.dataTransfer.files[0]); });

// ---- 放大预览（滚轮缩放 + 拖动平移）----
const zoom = $("zoom"), stage = $("zoomStage");
let z = {k:1, x:0, y:0};
const applyZ = () => stage.style.transform = `translate(${z.x}px,${z.y}px) scale(${z.k})`;
function zoomFit(){
  const w = stage.offsetWidth, h = stage.offsetHeight;
  z.k = Math.min(1, (innerWidth-40)/w, (innerHeight-40)/h) || 1;
  z.x = (innerWidth - w*z.k)/2; z.y = (innerHeight - h*z.k)/2; applyZ();
}
function zoomBy(f, cx = innerWidth/2, cy = innerHeight/2){
  const k = Math.min(10, Math.max(0.1, z.k*f)); f = k/z.k;
  z.x = cx - (cx - z.x)*f; z.y = cy - (cy - z.y)*f; z.k = k; applyZ();
}
function openZoom(node, kind){
  if (!node || node.classList?.contains("err")) return;
  const n = node.cloneNode(true);
  stage.className = $("bg").value; stage.style.background = bgColor() || "repeating-conic-gradient(#e5e7eb 0 25%,#fff 0 50%) 0 0/16px 16px";
  stage.style.color = fgColor();
  if (kind === "mermaid") { const [,,vw,vh] = (n.getAttribute("viewBox")||"").split(/[\s,]+/).map(Number); if (vw) { n.setAttribute("width", vw); n.setAttribute("height", vh); } n.style.maxWidth = "none"; }
  stage.replaceChildren(n);
  zoom.classList.add("show"); for (const id of ["zoomBar","zoomHint"]) $(id).hidden = false;
  zoomFit();
}
function closeZoom(){ zoom.classList.remove("show"); for (const id of ["zoomBar","zoomHint"]) $(id).hidden = true; }
zoom.addEventListener("wheel", e => { e.preventDefault(); zoomBy(e.deltaY < 0 ? 1.15 : 1/1.15, e.clientX, e.clientY); }, {passive:false});
let drag = null;
zoom.addEventListener("pointerdown", e => { drag = {x:e.clientX-z.x, y:e.clientY-z.y, sx:e.clientX, sy:e.clientY}; zoom.setPointerCapture(e.pointerId); zoom.classList.add("drag"); });
zoom.addEventListener("pointermove", e => { if (!drag) return; z.x = e.clientX-drag.x; z.y = e.clientY-drag.y; applyZ(); });
zoom.addEventListener("pointerup", e => { zoom.classList.remove("drag"); if (drag && Math.hypot(e.clientX-drag.sx, e.clientY-drag.sy) < 4 && e.target === zoom) closeZoom(); drag = null; });
zoom.addEventListener("dblclick", zoomFit);
$("zIn").onclick = () => zoomBy(1.25); $("zOut").onclick = () => zoomBy(1/1.25); $("zFit").onclick = zoomFit; $("zClose").onclick = closeZoom;
addEventListener("keydown", e => { if (e.key === "Escape") closeZoom(); });
$("copyAll").addEventListener("click", () => {
  const ok = items.filter(i => i.getCanvas);
  if (!ok.length) return toast("没有可复制的图");
  copyBlob(Promise.all(ok.map(i => i.getCanvas())).then(cs => toBlob(cs.length === 1 ? cs[0] : stitch(cs))));
});

  src.value = `# 下单流程

flowchart TD
